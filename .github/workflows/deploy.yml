name: CI/CD Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Login to GHCR (use built-in token)
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      # 2b. Generate lowercased image name
      - name: Generate Image Name
        run: |
          echo "IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}/nextjs:latest" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 3. Build image
      - name: Build Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .

      # 4. Push image
      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}

      # 5. Create deployment directory on droplet if not exists
      - name: Create deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /support-creator-web

      # 6. Copy docker-compose-shared.yml via SCP
      - name: Copy Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-shared.yml"
          target: "/support-creator-web"
          strip_components: 0

      # 7. Deploy to DO via SSH
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            cd /support-creator-web

            # Pull latest images defined in docker-compose-shared.yml
            docker compose -f docker-compose-shared.yml pull

            # Recreate containers with new image and force update
            docker compose -f docker-compose-shared.yml up -d --force-recreate

            # Cleanup old images to save disk space
            docker image prune -f